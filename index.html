<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa | GasoES</title>
    <link rel="shortcut icon" href="/img/favicon.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <script src="js/ui-loader.js"></script>
</head>

<body>
    <div class="container"></div>

    <div id="loader">
        <div class="text-center bg-white p-5 rounded-3 shadow">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <h4 class="fw-bold">Obteniendo Precios...</h4>
            <p class="text-muted mb-0">Estamos conectando con el Geoportal del Ministerio.</p>
        </div>
    </div>

    <div class="btn-ubicacion" onclick="miUbicacion()" title="Mi ubicación">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8 16a.5.5 0 0 1-.5-.5v-1.1c-3.022-.245-5.455-2.678-5.7-5.7H.5a.5.5 0 0 1 0-1h1.1c.245-3.022 2.678-5.455 5.7-5.7V.5a.5.5 0 0 1 1 0v1.1c3.022.245 5.455 2.678 5.7 5.7h1.1a.5.5 0 0 1 0 1h-1.1c-.245 3.022-2.678 5.455-5.7 5.7v1.1a.5.5 0 0 1-.5.5zM4.5 8a3.5 3.5 0 1 0 7 0 3.5 3.5 0 0 0-7 0z" />
        </svg>
    </div>

    <div class="btn-info-flotante" onclick="abrirPanelStats()" title="Estadísticas de la zona">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" />
        </svg>
    </div>

    <div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="offcanvasStats"
        aria-labelledby="offcanvasStatsLabel">
        <div class="offcanvas-header bg-primary text-white">
            <h5 class="offcanvas-title fw-bold" id="offcanvasStatsLabel">
                <i class="bi bi-graph-up-arrow me-2"></i> Análisis de Precios
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="leyenda-container">
        </div>
    </div>

    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script src="js/dataManager.js"></script>
    <script src="/js/main.js"></script>
</body>

</html>
